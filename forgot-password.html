<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password | CyrusLinksHub</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
/* LAYOUT ONLY — glass/buttons/text stay from style.css */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.auth-card{width:100%;max-width:440px;text-align:center}
.auth-card label{display:block;text-align:left}
/* Transparent SEND RESET LINK button */
.btn-reset{width:100%;background:transparent;border:2px solid var(--cyan);color:var(--cyan);box-shadow:0 0 12px rgba(0,240,255,.25),inset 0 0 12px rgba(0,240,255,.1)}
.btn-reset:hover{background:rgba(0,240,255,.1);box-shadow:0 0 25px rgba(0,240,255,.5)}
.auth-switch{margin-top:14px;font-size:.9rem;color:var(--muted)}
.auth-note{font-size:.7rem;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-top:16px}
.auth-note .dot{color:var(--green)}
</style>
</head>
<body>

<div class="auth-wrap">
<div class="glass auth-card">

<h2>RESET PASSWORD</h2>
<p>Enter your email and we'll send you a password reset link.</p>

<div class="loading-msg" id="authLoad">SENDING RESET LINK...</div>
<div class="error-msg" id="authError"></div>
<div class="success-msg" id="authOk"></div>

<label>Email Address</label>
<input type="email" id="email" placeholder="operator@hub.net" autocomplete="email">

<button class="btn-reset" onclick="runAuth('sendToken')"><i class="fa-solid fa-paper-plane"></i> SEND RESET LINK</button>

<p class="auth-switch">Remember your password? <a href="login.html">Sign in</a></p>
<p class="auth-switch">Don't have an account? <a href="register.html">Create account</a></p>
<p class="auth-note"><span class="dot">●</span> Secure password recovery</p>

</div>
</div>

<script src="auth-firebase.js"></script>
<script>
function showLoad(){var e=document.getElementById('authLoad');if(e)e.style.display='block';}
function hideLoad(){var e=document.getElementById('authLoad');if(e)e.style.display='none';}
if(typeof err==='function'){var _e=err,_o=ok;err=function(m){hideLoad();_e(m);};ok=function(m){hideLoad();_o(m);};}
function runAuth(fn,arg){if(typeof window[fn]!=='function'){alert('auth-firebase.js not connected yet.');return;}showLoad();window[fn](arg);}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#05010d"
    >

    <meta
        name="description"
        content="Reset your CyrusLinksHub account password"
    >

    <title>Forgot Password | CyrusLinksHub</title>

    <!-- YOUR EXISTING STYLE.CSS -->
    <link rel="stylesheet" href="style.css">

</head>


<body>


    <main class="container">


        <section
            class="glass"
            style="
                width:100%;
                max-width:440px;
                margin:60px auto;
            "
        >


            <!-- HEADER -->

            <div
                style="
                    text-align:center;
                    margin-bottom:25px;
                "
            >

                <h1>
                    RESET PASSWORD
                </h1>

                <p>
                    Enter your email and we'll send you a
                    password reset link.
                </p>

            </div>


            <!-- ERROR -->

            <div
                class="error-msg"
                id="errorMsg"
                role="alert"
                aria-live="polite"
            ></div>


            <!-- SUCCESS -->

            <div
                class="success-msg"
                id="successMsg"
                role="status"
                aria-live="polite"
            ></div>


            <!-- LOADING -->

            <div
                class="loading-msg"
                id="loadingMsg"
                role="status"
            >
                SENDING RESET LINK...
            </div>


            <!-- FORM -->

            <form
                id="forgotForm"
                novalidate
            >


                <!-- EMAIL -->

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="email"
                    placeholder="Enter your account email"
                    maxlength="120"
                    required
                >


                <!-- SUBMIT -->

                <button
                    type="submit"
                    id="resetButton"
                    style="
                        width:100%;
                    "
                >

                    <span id="buttonText">
                        SEND RESET LINK
                    </span>

                </button>


            </form>


            <!-- BACK TO LOGIN -->

            <hr>

            <p
                style="
                    text-align:center;
                    margin-top:15px;
                "
            >

                Remember your password?

                <a href="login.html">
                    Sign in
                </a>

            </p>


            <!-- REGISTER -->

            <p
                style="
                    text-align:center;
                    margin-top:10px;
                "
            >

                Don't have an account?

                <a href="register.html">
                    Create account
                </a>

            </p>


            <!-- SECURITY -->

            <p
                style="
                    text-align:center;
                    color:var(--green);
                    font-size:.7rem;
                    letter-spacing:1px;
                    text-transform:uppercase;
                    margin-top:18px;
                "
            >

                ● Secure password recovery

            </p>


        </section>


    </main>


    <!-- JAVASCRIPT -->

    <script>

        (() => {

            "use strict";


            const form =
                document.getElementById(
                    "forgotForm"
                );

            const email =
                document.getElementById(
                    "email"
                );

            const button =
                document.getElementById(
                    "resetButton"
                );

            const buttonText =
                document.getElementById(
                    "buttonText"
                );

            const errorMsg =
                document.getElementById(
                    "errorMsg"
                );

            const successMsg =
                document.getElementById(
                    "successMsg"
                );

            const loadingMsg =
                document.getElementById(
                    "loadingMsg"
                );


            /* =========================
               FORM SUBMISSION
            ========================== */

            form.addEventListener(
                "submit",
                async (event) => {

                    event.preventDefault();


                    errorMsg.style.display =
                        "none";

                    successMsg.style.display =
                        "none";

                    loadingMsg.style.display =
                        "none";


                    const emailValue =
                        email.value.trim();


                    /* VALIDATION */

                    if (!emailValue) {

                        errorMsg.textContent =
                            "Please enter your email address.";

                        errorMsg.style.display =
                            "block";

                        return;

                    }


                    if (!email.checkValidity()) {

                        errorMsg.textContent =
                            "Please enter a valid email address.";

                        errorMsg.style.display =
                            "block";

                        return;

                    }


                    /* LOADING */

                    button.disabled =
                        true;

                    buttonText.textContent =
                        "SENDING...";

                    loadingMsg.style.display =
                        "block";


                    /*
                    ==========================================
                    REAL PASSWORD RESET API
                    ==========================================

                    Replace the demo section with your backend.

                    Example:

                    const response = await fetch(
                        "/api/forgot-password",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                email: emailValue
                            })
                        }
                    );

                    const data =
                        await response.json();

                    if (!response.ok) {
                        throw new Error(
                            data.message ||
                            "Unable to send reset link."
                        );
                    }

                    ==========================================
                    */


                    await new Promise(
                        resolve =>
                            setTimeout(
                                resolve,
                                1000
                            )
                    );


                    button.disabled =
                        false;

                    buttonText.textContent =
                        "SEND RESET LINK";

                    loadingMsg.style.display =
                        "none";


                    /* DEMO SUCCESS */

                    successMsg.textContent =
                        "Demo mode: connect this form to your password-reset backend.";

                    successMsg.style.display =
                        "block";


                    /*
                     * For a real system, don't reveal
                     * whether an email exists.
                     *
                     * A generic message such as:
                     *
                     * "If an account exists for this
                     * email, a reset link has been sent."
                     *
                     * is safer.
                     */

                }
            );


        })();

    </script>


</body>

</html>

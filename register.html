<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account | CyrusLinksHub</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
/* LAYOUT ONLY — glass/buttons/text stay from style.css */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.auth-card{width:100%;max-width:440px;text-align:center}
.auth-card label{display:block;text-align:left}
.terms-label{display:flex !important;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-size:.85rem;color:var(--muted);margin:6px 0 14px}
.pass-wrap{position:relative}
.pass-wrap input{padding-right:50px}
.pass-eye{position:absolute;right:6px;top:9px;background:transparent;border:none;box-shadow:none;color:var(--cyan);padding:8px;width:auto}
.pass-eye:hover{transform:none;box-shadow:none;text-shadow:0 0 10px var(--cyan)}
/* Transparent CREATE ACCOUNT button */
.btn-signup{width:100%;background:transparent;border:2px solid var(--cyan);color:var(--cyan);box-shadow:0 0 12px rgba(0,240,255,.25),inset 0 0 12px rgba(0,240,255,.1)}
.btn-signup:hover{background:rgba(0,240,255,.1);box-shadow:0 0 25px rgba(0,240,255,.5)}
.auth-switch{margin-top:14px;font-size:.9rem;color:var(--muted)}
.auth-note{font-size:.7rem;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-top:16px}
.auth-note .dot{color:var(--green)}
</style>
</head>
<body>

<div class="auth-wrap">
<div class="glass auth-card">

<h2>CREATE ACCOUNT</h2>
<p>Join CyrusLinksHub and get started.</p>

<div class="loading-msg" id="authLoad">CREATING ACCOUNT...</div>
<div class="error-msg" id="authError"></div>
<div class="success-msg" id="authOk"></div>

<label>Full Name</label>
<input type="text" id="suName" placeholder="Your full name" autocomplete="name">

<label>Username</label>
<input type="text" id="suUser" placeholder="Username" maxlength="24" autocomplete="username">

<label>Email Address</label>
<input type="email" id="email" placeholder="operator@hub.net" autocomplete="email">

<label>Password</label>
<div class="pass-wrap">
<input type="password" id="pass" placeholder="Min 6 characters" autocomplete="new-password">
<button class="pass-eye" type="button" onclick="togglePass('pass','eye1')"><i class="fa-solid fa-eye" id="eye1"></i></button>
</div>

<label>Confirm Password</label>
<div class="pass-wrap">
<input type="password" id="pass2" placeholder="Repeat password" autocomplete="new-password">
<button class="pass-eye" type="button" onclick="togglePass('pass2','eye2')"><i class="fa-solid fa-eye" id="eye2"></i></button>
</div>

<label class="terms-label">
<input type="checkbox" id="terms">
<span>I agree to the <a href="terms.html">Terms</a> and <a href="privacy.html">Privacy Policy</a></span>
</label>

<button class="btn-signup" onclick="runAuth('doRegister')"><i class="fa-solid fa-user-plus"></i> CREATE ACCOUNT</button>

<p class="auth-switch">Already have an account? <a href="login.html">Sign in</a></p>
<p class="auth-note"><span class="dot">●</span> Secure registration</p>

</div>
</div>

<script src="auth-firebase.js"></script>
<script>
function showLoad(){var e=document.getElementById('authLoad');if(e)e.style.display='block';}
function hideLoad(){var e=document.getElementById('authLoad');if(e)e.style.display='none';}
if(typeof err==='function'){var _e=err,_o=ok;err=function(m){hideLoad();_e(m);};ok=function(m){hideLoad();_o(m);};}
function runAuth(fn,arg){if(typeof window[fn]!=='function'){alert('auth-firebase.js not connected yet.');return;}showLoad();window[fn](arg);}
</script>
</body>
                                                                                                                        </html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#05010d"
    >

    <meta
        name="description"
        content="Sign in to your CyrusLinksHub account"
    >

    <title>Login | CyrusLinksHub</title>

    <!-- YOUR EXISTING STYLE.CSS ONLY -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <section
            class="glass"
            style="
                width:100%;
                max-width:440px;
                margin:60px auto;
            "
        >

            <!-- HEADER -->

            <div
                style="
                    text-align:center;
                    margin-bottom:28px;
                "
            >

                <h1>
                    SIGN IN
                </h1>

                <p>
                    Sign in to your CyrusLinksHub account
                </p>

            </div>


            <!-- ERROR MESSAGE -->

            <div
                class="error-msg"
                id="errorMsg"
                role="alert"
                aria-live="polite"
            ></div>


            <!-- LOADING MESSAGE -->

            <div
                class="loading-msg"
                id="loadingMsg"
                role="status"
            >
                AUTHENTICATING...
            </div>


            <!-- LOGIN FORM -->

            <form
                id="loginForm"
                novalidate
            >

                <!-- EMAIL -->

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="email"
                    placeholder="Enter your email"
                    maxlength="120"
                    required
                >


                <!-- PASSWORD -->

                <label for="password">
                    Password
                </label>

                <div
                    style="
                        position:relative;
                    "
                >

                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="current-password"
                        placeholder="Enter your password"
                        maxlength="200"
                        required
                        style="
                            padding-right:50px;
                        "
                    >

                    <button
                        type="button"
                        id="togglePassword"
                        aria-label="Show password"
                        title="Show password"
                        style="
                            position:absolute;
                            right:5px;
                            top:4px;
                            width:40px;
                            height:40px;
                            padding:0;
                            background:transparent;
                            border:0;
                            box-shadow:none;
                            color:var(--muted);
                        "
                    >
                        ◉
                    </button>

                </div>


                <!-- OPTIONS -->

                <div
                    style="
                        display:flex;
                        justify-content:space-between;
                        align-items:center;
                        gap:10px;
                        margin:2px 0 18px;
                        font-size:.85rem;
                    "
                >

                    <label
                        style="
                            display:flex;
                            align-items:center;
                            gap:7px;
                            margin:0;
                            cursor:pointer;
                        "
                    >

                        <input
                            type="checkbox"
                            id="remember"
                            style="
                                width:auto;
                                margin:0;
                            "
                        >

                        <span
                            style="
                                color:var(--muted);
                                font-family:'Rajdhani',sans-serif;
                                text-transform:none;
                                letter-spacing:0;
                                font-size:.9rem;
                            "
                        >
                            Remember me
                        </span>

                    </label>


                    <a href="forgot-password.html">
                        Forgot password?
                    </a>

                </div>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    id="loginButton"
                    style="
                        width:100%;
                    "
                >

                    <span id="loginText">
                        ⚡ SIGN IN
                    </span>

                </button>

            </form>


            <!-- SOCIAL DIVIDER -->

            <div
                style="
                    display:flex;
                    align-items:center;
                    gap:12px;
                    margin:24px 0 18px;
                    color:var(--muted);
                    font-family:'Orbitron',sans-serif;
                    font-size:.68rem;
                    letter-spacing:1.5px;
                    text-transform:uppercase;
                "
            >

                <span
                    style="
                        flex:1;
                        height:1px;
                        background:
                            linear-gradient(
                                90deg,
                                transparent,
                                var(--border)
                            );
                    "
                ></span>

                <span>
                    OR CONTINUE WITH
                </span>

                <span
                    style="
                        flex:1;
                        height:1px;
                        background:
                            linear-gradient(
                                90deg,
                                var(--border),
                                transparent
                            );
                    "
                ></span>

            </div>


            <!-- SOCIAL LOGIN BUTTONS -->

            <div
                style="
                    display:grid;
                    grid-template-columns:
                        repeat(3, minmax(0, 1fr));
                    gap:9px;
                    margin-bottom:22px;
                "
            >

                <!-- GOOGLE -->

                <a
                    href="/auth/google"
                    class="social-login"
                    aria-label="Continue with Google"
                    style="
                        display:flex;
                        align-items:center;
                        justify-content:center;
                        gap:6px;
                        min-height:44px;
                        padding:8px 5px;

                        border:1px solid
                            rgba(255,255,255,.16);

                        border-radius:10px;

                        background:
                            rgba(255,255,255,.035);

                        color:var(--text);

                        font-family:'Rajdhani',
                            sans-serif;

                        font-weight:600;

                        font-size:.82rem;

                        text-decoration:none;

                        transition:.3s;
                    "
                >

                    <span
                        style="
                            color:#4285F4;
                            font-family:Arial,sans-serif;
                            font-size:1.15rem;
                            font-weight:700;
                        "
                    >
                        G
                    </span>

                    Google

                </a>


                <!-- GITHUB -->

                <a
                    href="/auth/github"
                    class="social-login"
                    aria-label="Continue with GitHub"
                    style="
                        display:flex;
                        align-items:center;
                        justify-content:center;
                        gap:6px;
                        min-height:44px;
                        padding:8px 5px;

                        border:1px solid
                            rgba(255,255,255,.16);

                        border-radius:10px;

                        background:
                            rgba(255,255,255,.035);

                        color:var(--text);

                        font-family:'Rajdhani',
                            sans-serif;

                        font-weight:600;

                        font-size:.82rem;

                        text-decoration:none;

                        transition:.3s;
                    "
                >

                    <span
                        style="
                            color:#ffffff;
                            font-size:1.05rem;
                        "
                    >
                        ●
                    </span>

                    GitHub

                </a>


                <!-- DISCORD -->

                <a
                    href="/auth/discord"
                    class="social-login"
                    aria-label="Continue with Discord"
                    style="
                        display:flex;
                        align-items:center;
                        justify-content:center;
                        gap:6px;
                        min-height:44px;
                        padding:8px 5px;

                        border:1px solid
                            rgba(255,255,255,.16);

                        border-radius:10px;

                        background:
                            rgba(255,255,255,.035);

                        color:var(--text);

                        font-family:'Rajdhani',
                            sans-serif;

                        font-weight:600;

                        font-size:.82rem;

                        text-decoration:none;

                        transition:.3s;
                    "
                >

                    <span
                        style="
                            color:#5865F2;
                            font-size:1.05rem;
                        "
                    >
                        ●
                    </span>

                    Discord

                </a>

            </div>


            <!-- REGISTER -->

            <hr>

            <p
                style="
                    text-align:center;
                    font-size:.9rem;
                    margin-top:15px;
                "
            >

                Don't have an account?

                <a href="register.html">
                    Create account
                </a>

            </p>


            <!-- SECURITY STATUS -->

            <p
                style="
                    text-align:center;
                    color:var(--green);
                    font-size:.7rem;
                    letter-spacing:1px;
                    text-transform:uppercase;
                    margin-top:18px;
                "
            >

                <span
                    style="
                        display:inline-block;
                        width:7px;
                        height:7px;
                        border-radius:50%;
                        background:var(--green);
                        box-shadow:0 0 9px var(--green);
                        margin-right:5px;
                    "
                ></span>

                Secure authentication

            </p>

        </section>

    </main>


    <!-- JAVASCRIPT -->

    <script>

        (() => {

            "use strict";


            /* ELEMENTS */

            const form =
                document.getElementById(
                    "loginForm"
                );

            const email =
                document.getElementById(
                    "email"
                );

            const password =
                document.getElementById(
                    "password"
                );

            const toggle =
                document.getElementById(
                    "togglePassword"
                );

            const button =
                document.getElementById(
                    "loginButton"
                );

            const loginText =
                document.getElementById(
                    "loginText"
                );

            const error =
                document.getElementById(
                    "errorMsg"
                );

            const loading =
                document.getElementById(
                    "loadingMsg"
                );

            const remember =
                document.getElementById(
                    "remember"
                );


            /* REMEMBER EMAIL */

            try {

                const savedEmail =
                    localStorage.getItem(
                        "clh_login_email"
                    );

                if (savedEmail) {

                    email.value =
                        savedEmail;

                    remember.checked =
                        true;

                }

            } catch (_) {}


            /* PASSWORD VISIBILITY */

            toggle.addEventListener(
                "click",
                () => {

                    const isPassword =
                        password.type ===
                        "password";

                    password.type =
                        isPassword
                            ? "text"
                            : "password";

                    toggle.textContent =
                        isPassword
                            ? "◎"
                            : "◉";

                    toggle.setAttribute(
                        "aria-label",
                        isPassword
                            ? "Hide password"
                            : "Show password"
                    );

                }
            );


            /* LOGIN */

            form.addEventListener(
                "submit",
                async (event) => {

                    event.preventDefault();


                    error.style.display =
                        "none";


                    const emailValue =
                        email.value.trim();

                    const passwordValue =
                        password.value;


                    /* VALIDATION */

                    if (
                        !emailValue ||
                        !passwordValue
                    ) {

                        error.textContent =
                            "Please enter your email and password.";

                        error.style.display =
                            "block";

                        return;

                    }


                    if (
                        !email.checkValidity()
                    ) {

                        error.textContent =
                            "Please enter a valid email address.";

                        error.style.display =
                            "block";

                        return;

                    }


                    /* REMEMBER EMAIL */

                    try {

                        if (
                            remember.checked
                        ) {

                            localStorage.setItem(
                                "clh_login_email",
                                emailValue
                            );

                        } else {

                            localStorage.removeItem(
                                "clh_login_email"
                            );

                        }

                    } catch (_) {}


                    /* LOADING */

                    button.disabled =
                        true;

                    loginText.textContent =
                        "SIGNING IN...";

                    loading.style.display =
                        "block";


                    /*
                     * =================================================
                     * REAL LOGIN API
                     * =================================================
                     *
                     * Replace the demo section below with your
                     * actual backend authentication request.
                     *
                     * Example:
                     *
                     * const response = await fetch(
                     *     "/api/login",
                     *     {
                     *         method: "POST",
                     *         headers: {
                     *             "Content-Type":
                     *                 "application/json"
                     *         },
                     *         body: JSON.stringify({
                     *             email: emailValue,
                     *             password: passwordValue
                     *         })
                     *     }
                     * );
                     *
                     * const data = await response.json();
                     *
                     * if (response.ok) {
                     *     window.location.href =
                     *         "dashboard.html";
                     * }
                     */


                    await new Promise(
                        resolve =>
                            setTimeout(
                                resolve,
                                800
                            )
                    );


                    button.disabled =
                        false;

                    loginText.textContent =
                        "⚡ SIGN IN";

                    loading.style.display =
                        "none";


                    error.textContent =
                        "Demo mode: connect this form to your authentication backend.";

                    error.style.display =
                        "block";

                }
            );

        })();

    </script>

</body>
    </html>

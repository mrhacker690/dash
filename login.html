<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — CyrusLinksHub</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<!-- 🔥 WHEN READY: uncomment for Firebase Auth -->
<!-- <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script> -->
<!-- <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script> -->
<style>
.auth-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
.auth-card{width:100%;max-width:470px;text-align:center;padding:38px 28px;}
.auth-mode{display:inline-block;margin-top:10px;}
.social-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0;}
.pv{color:#fff;box-shadow:none;font-size:.78rem;}
.pv.google{background:linear-gradient(135deg,#ea4335,#fbbc05);}
.pv.discord{background:linear-gradient(135deg,#5865F2,#7b2bff);}
.pv.facebook{background:linear-gradient(135deg,#1877f2,#0e5aa7);}
.pv.github{background:linear-gradient(135deg,#444,#000);border:1px solid #666;}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);margin:16px 0;font-size:.78rem;letter-spacing:2px;text-transform:uppercase;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border);}
.auth-error,.auth-ok{display:none;margin:10px 0;padding:10px;border-radius:10px;font-size:.9rem;}
.auth-error{background:rgba(255,0,80,.12);border:1px solid var(--red);color:#ff5588;}
.auth-ok{background:rgba(0,255,157,.1);border:1px solid var(--green);color:var(--green);}
.pass-wrap{position:relative;}
.pass-wrap input{padding-right:50px;}
.pass-eye{position:absolute;right:6px;top:10px;background:transparent;border:none;box-shadow:none;color:var(--cyan);padding:8px;width:auto;}
.pass-eye:hover{transform:none;box-shadow:none;text-shadow:0 0 10px var(--cyan);}
.auth-row{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;margin:4px 0 14px;color:var(--muted);}
.auth-row a{color:var(--cyan);}
.auth-note{font-size:.72rem;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-top:16px;}
.back-home{display:inline-block;margin-top:12px;font-size:.85rem;}
.auth-switch{margin-top:14px;font-size:.9rem;color:var(--muted);}
</style>
</head>
<body>

<div class="auth-wrap">
    <div class="glass auth-card">
        <a href="index.html" class="logo glitch" data-text="cyruslinkshub">cyruslinkshub</a>
        <p class="tagline" style="margin-top:10px;">Secure Access Portal</p>
        <span class="info-chip auth-mode" id="authMode"><i class="fa-solid fa-flask"></i> Demo Mode</span>

        <div class="auth-error" id="authError"></div>
        <div class="auth-ok" id="authOk"></div>

        <div class="social-grid">
            <button class="pv google" onclick="socialLogin('Google')"><i class="fa-brands fa-google"></i> Google</button>
            <button class="pv discord" onclick="socialLogin('Discord')"><i class="fa-brands fa-discord"></i> Discord</button>
            <button class="pv facebook" onclick="socialLogin('Facebook')"><i class="fa-brands fa-facebook-f"></i> Facebook</button>
            <button class="pv github" onclick="socialLogin('GitHub')"><i class="fa-brands fa-github"></i> GitHub</button>
        </div>

        <div class="divider">or sign in with email</div>

        <input type="email" id="email" placeholder="Email address" autocomplete="email">
        <div class="pass-wrap">
            <input type="password" id="pass" placeholder="Password" autocomplete="current-password">
            <button class="pass-eye" onclick="togglePass('pass','eye1')" type="button"><i class="fa-solid fa-eye" id="eye1"></i></button>
        </div>

        <div class="auth-row">
            <label style="margin:0;"><input type="checkbox" checked> Remember me</label>
            <a href="forgot.html">Forgot password?</a>
        </div>

        <button onclick="submitLogin()" style="width:100%;"><i class="fa-solid fa-bolt"></i> Sign In</button>

        <p class="auth-switch">New here? <a href="signup.html">Create an account</a></p>
        <p class="auth-note"><i class="fa-solid fa-shield-halved"></i> Protected • Firebase-ready</p>
        <a href="index.html" class="back-home"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
    </div>
</div>

<script src="auth-core.js"></script>
<script>
if (read(P_KEY, null)) location.replace('tools.html');

function submitLogin() {
    hideMsgs();
    var email = val('email').toLowerCase(), pass = val('pass');

    if (FB) {
        if (!email || !pass) { showErr('Enter email and password.'); return; }
        FB.auth().signInWithEmailAndPassword(email, pass).then(function (r) {
            enterHub(profileFromFirebase(r.user, 'Email'));
        }).catch(function (e) { showErr(friendly(e.code)); });
        return;
    }
    var users = read(U_KEY, {});
    if (!users[email]) { showErr('No account found. Create one first.'); return; }
    if (users[email].pass !== hash(pass)) { showErr('Wrong password. Try again.'); return; }
    enterHub({ name: users[email].name, email: email, provider: 'Email', avatar: avatarFor(users[email].name, 'Email'), ts: Date.now() });
}

function socialLogin(p) {
    hideMsgs();
    if (FB) {
        var prov = p === 'Google' ? new FB.auth.GoogleAuthProvider()
                 : p === 'Facebook' ? new FB.auth.FacebookAuthProvider()
                 : p === 'GitHub' ? new FB.auth.GithubAuthProvider() : null;
        if (!prov) { showErr('Discord is not supported by Firebase — use Google, Facebook or GitHub.'); return; }
        FB.auth().signInWithPopup(prov).then(function (r) { enterHub(profileFromFirebase(r.user, p)); })
            .catch(function (e) { showErr(friendly(e.code)); });
        return;
    }
    var name = prompt('Sign in with ' + p + ' — enter your display name:');
    if (!name) return;
    name = name.trim();
    if (name.length < 3) { showErr('Name must be at least 3 characters.'); return; }
    enterHub({ name: name, email: '', provider: p, avatar: avatarFor(name, p), ts: Date.now() });
}
setModeChip();
</script>
</body>
                                                                                                      </html>

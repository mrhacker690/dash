<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#05010d">

    <title>Login | CyrusLinksHub</title>

    <link rel="stylesheet" href="style.css">

    <style>
        /* =====================================================
           CYRUSLINKSHUB — MODERN LOGIN
        ===================================================== */

        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-wrapper {
            width: 100%;
            max-width: 410px;
        }

        .auth-card {
            padding: 38px;
        }

        /* HEADER */

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-header h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
        }

        .auth-header p {
            font-size: .9rem;
            color: var(--muted);
        }

        /* FORM */

        .auth-form {
            display: flex;
            flex-direction: column;
        }

        .auth-field {
            margin-bottom: 16px;
        }

        .auth-field label {
            display: block;
            margin-bottom: 7px;
            margin-top: 0;
        }

        .auth-field input {
            width: 100%;
            height: 48px;

            padding: 0 14px;

            background: rgba(0,240,255,.045);

            border: 1px solid var(--border);
            border-radius: 10px;

            color: var(--text);

            font-family: 'Rajdhani', sans-serif;
            font-size: 1rem;

            outline: none;

            transition: .3s;
        }

        .auth-field input:focus {
            border-color: var(--cyan);

            background: rgba(0,240,255,.08);

            box-shadow:
                0 0 15px rgba(0,240,255,.22);
        }

        .auth-field input::placeholder {
            color: rgba(154,167,199,.55);
        }

        /* PASSWORD */

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 48px;
        }

        .password-toggle {
            position: absolute;

            right: 7px;
            top: 7px;

            width: 34px;
            height: 34px;

            padding: 0;

            background: transparent;
            border: none;

            color: var(--muted);

            box-shadow: none;

            font-family: sans-serif;
            font-size: 15px;
        }

        .password-toggle:hover {
            color: var(--cyan);
            background: rgba(0,240,255,.08);
            box-shadow: none;
            transform: none;
        }

        /* OPTIONS */

        .auth-options {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin: 2px 0 22px;

            font-size: .85rem;
        }

        .remember-box {
            display: flex;
            align-items: center;
            gap: 7px;

            color: var(--muted);

            cursor: pointer;
        }

        .remember-box input {
            width: auto;
            accent-color: var(--cyan);
        }

        .forgot-link {
            color: var(--cyan);
        }

        /* LOGIN */

        .auth-login {
            width: 100%;
            height: 50px;

            font-size: .82rem;

            position: relative;
            overflow: hidden;
        }

        /* DIVIDER */

        .auth-divider {
            display: flex;
            align-items: center;

            gap: 12px;

            margin: 25px 0;

            color: var(--muted);

            font-size: .7rem;

            letter-spacing: 1.5px;
        }

        .auth-divider::before,
        .auth-divider::after {
            content: "";

            flex: 1;

            height: 1px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    var(--border)
                );
        }

        .auth-divider::after {
            background:
                linear-gradient(
                    90deg,
                    var(--border),
                    transparent
                );
        }

        /* REGISTER */

        .register-text {
            text-align: center;

            color: var(--muted);

            font-size: .87rem;
        }

        .register-text a {
            color: var(--pink);
            font-weight: 600;
        }

        /* STATUS */

        .auth-status {
            display: flex;

            justify-content: center;
            align-items: center;

            gap: 7px;

            margin-top: 24px;

            font-size: .68rem;

            letter-spacing: 1.2px;

            text-transform: uppercase;

            color: var(--green);
        }

        .auth-status-dot {
            width: 6px;
            height: 6px;

            border-radius: 50%;

            background: var(--green);

            box-shadow:
                0 0 9px var(--green);

            animation: statusPulse 1.5s infinite;
        }

        @keyframes statusPulse {

            0%,100% {
                opacity: 1;
            }

            50% {
                opacity: .35;
            }

        }

        /* ERROR */

        .auth-error {
            display: none;

            margin-bottom: 15px;

            padding: 11px 13px;

            border-radius: 9px;

            background: rgba(255,0,80,.1);

            border: 1px solid var(--red);

            color: #ff6b95;

            font-size: .82rem;

            text-align: center;
        }

        /* LOADING */

        .auth-loading {
            display: none;

            text-align: center;

            margin-bottom: 15px;

            color: var(--cyan);

            font-size: .78rem;

            letter-spacing: 1px;
        }

        /* SHAKE */

        .auth-card.shake {
            animation: authShake .35s ease;
        }

        @keyframes authShake {

            25% {
                transform: translateX(-5px);
            }

            50% {
                transform: translateX(5px);
            }

            75% {
                transform: translateX(-3px);
            }

        }

        /* MOBILE */

        @media (max-width: 500px) {

            .auth-page {
                padding: 14px;
            }

            .auth-card {
                padding: 28px 20px;
            }

            .auth-header h1 {
                font-size: 1.5rem;
            }

        }
    </style>
</head>

<body>

    <main class="auth-page">

        <div class="auth-wrapper">

            <section class="glass auth-card" id="authCard">

                <!-- HEADER -->

                <div class="auth-header">

                    <h1>
                        SIGN IN
                    </h1>

                    <p>
                        Sign in to your CyrusLinksHub account
                    </p>

                </div>


                <!-- ERROR -->

                <div
                    class="auth-error"
                    id="authError"
                    role="alert">
                </div>


                <!-- LOADING -->

                <div
                    class="auth-loading"
                    id="authLoading">

                    AUTHENTICATING...

                </div>


                <!-- FORM -->

                <form
                    class="auth-form"
                    id="loginForm"
                    novalidate>


                    <!-- EMAIL -->

                    <div class="auth-field">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            autocomplete="email"
                            placeholder="Enter your email"
                            required>

                    </div>


                    <!-- PASSWORD -->

                    <div class="auth-field">

                        <label for="password">
                            Password
                        </label>

                        <div class="password-box">

                            <input
                                type="password"
                                id="password"
                                name="password"
                                autocomplete="current-password"
                                placeholder="Enter your password"
                                required>

                            <button
                                type="button"
                                class="password-toggle"
                                id="passwordToggle"
                                aria-label="Show password">

                                ◉

                            </button>

                        </div>

                    </div>


                    <!-- OPTIONS -->

                    <div class="auth-options">

                        <label class="remember-box">

                            <input
                                type="checkbox"
                                id="remember">

                            <span>
                                Remember me
                            </span>

                        </label>


                        <a
                            href="forgot-password.html"
                            class="forgot-link">

                            Forgot password?

                        </a>

                    </div>


                    <!-- LOGIN BUTTON -->

                    <button
                        type="submit"
                        class="auth-login"
                        id="loginButton">

                        <span id="loginText">
                            SIGN IN
                        </span>

                    </button>

                </form>


                <!-- DIVIDER -->

                <div class="auth-divider">
                    OR
                </div>


                <!-- REGISTER -->

                <div class="register-text">

                    Don't have an account?

                    <a href="register.html">
                        Create account
                    </a>

                </div>


                <!-- SECURITY -->

                <div class="auth-status">

                    <span class="auth-status-dot"></span>

                    Secure authentication

                </div>

            </section>

        </div>

    </main>


    <script>

        (() => {

            const form =
                document.getElementById("loginForm");

            const email =
                document.getElementById("email");

            const password =
                document.getElementById("password");

            const toggle =
                document.getElementById("passwordToggle");

            const button =
                document.getElementById("loginButton");

            const loginText =
                document.getElementById("loginText");

            const error =
                document.getElementById("authError");

            const loading =
                document.getElementById("authLoading");

            const card =
                document.getElementById("authCard");


            /* PASSWORD VISIBILITY */

            toggle.addEventListener(
                "click",
                () => {

                    const hidden =
                        password.type === "password";

                    password.type =
                        hidden
                            ? "text"
                            : "password";

                    toggle.textContent =
                        hidden ? "◎" : "◉";

                    toggle.setAttribute(
                        "aria-label",
                        hidden
                            ? "Hide password"
                            : "Show password"
                    );

                }
            );


            /* LOGIN */

            form.addEventListener(
                "submit",
                async (event) => {

                    event.preventDefault();

                    error.style.display = "none";


                    const emailValue =
                        email.value.trim();

                    const passwordValue =
                        password.value;


                    /* VALIDATION */

                    if (!emailValue ||
                        !passwordValue) {

                        error.textContent =
                            "Please enter your email and password.";

                        error.style.display =
                            "block";

                        card.classList.remove(
                            "shake"
                        );

                        void card.offsetWidth;

                        card.classList.add(
                            "shake"
                        );

                        return;

                    }


                    if (!email.checkValidity()) {

                        error.textContent =
                            "Please enter a valid email address.";

                        error.style.display =
                            "block";

                        return;

                    }


                    /* LOADING */

                    button.disabled = true;

                    loginText.textContent =
                        "SIGNING IN...";

                    loading.style.display =
                        "block";


                    /*
                        CONNECT YOUR REAL
                        AUTHENTICATION API HERE.

                        Example:

                        const response = await fetch(
                            "/api/login",
                            {
                                method: "POST",
                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },
                                body: JSON.stringify({
                                    email: emailValue,
                                    password: passwordValue
                                })
                            }
                        );

                    */


                    await new Promise(
                        resolve =>
                            setTimeout(resolve, 800)
                    );


                    button.disabled = false;

                    loginText.textContent =
                        "SIGN IN";

                    loading.style.display =
                        "none";


                    error.textContent =
                        "Demo mode: connect this form to your authentication backend.";

                    error.style.display =
                        "block";

                }
            );

        })();

    </script>

</body>
    </html>

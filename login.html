<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | CyrusLinksHub</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
/* LAYOUT ONLY — does not override glass/buttons/text */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.auth-card{width:100%;max-width:440px;text-align:center}
.pass-wrap{position:relative}
.pass-wrap input{padding-right:50px}
.pass-eye{position:absolute;right:6px;top:9px;background:transparent;border:none;box-shadow:none;color:var(--cyan);padding:8px;width:auto}
.pass-eye:hover{transform:none;box-shadow:none;text-shadow:0 0 10px var(--cyan)}
.auth-row{display:flex;justify-content:space-between;align-items:center;margin:4px 0 14px;font-size:.9rem}
.auth-row label{margin:0;display:flex;align-items:center;gap:6px}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);margin:16px 0;font-size:.72rem;letter-spacing:2px;text-transform:uppercase}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
.social-col{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.social-col button{flex:1 1 110px;font-size:.72rem}
.pv.google{background:linear-gradient(135deg,#ea4335,#fbbc05);color:#111}
.pv.github{background:linear-gradient(135deg,#444,#000);border:1px solid #666;color:#fff}
.pv.discord{background:linear-gradient(135deg,#5865F2,#7b2bff);color:#fff}
.auth-switch{margin-top:14px;font-size:.9rem;color:var(--muted)}
.auth-note{font-size:.7rem;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-top:16px}
.auth-note .dot{color:var(--green)}
</style>
</head>
<body>

<div class="auth-wrap">
<div class="glass auth-card">

<h2>SIGN IN</h2>
<p>Sign in to your CyrusLinksHub account</p>

<div class="loading-msg" id="authLoad">AUTHENTICATING...</div>
<div class="error-msg" id="authError"></div>
<div class="success-msg" id="authOk"></div>

<label>Email Address</label>
<input type="email" id="email" placeholder="operator@hub.net" autocomplete="email">

<label>Password</label>
<div class="pass-wrap">
<input type="password" id="pass" placeholder="••••••••" autocomplete="current-password">
<button class="pass-eye" type="button" onclick="togglePass('pass','eye1')"><i class="fa-solid fa-eye" id="eye1"></i></button>
</div>

<div class="auth-row">
<label><input type="checkbox" checked> Remember me</label>
<a href="forgot-password.html">Forgot password?</a>
</div>

<button style="width:100%" onclick="runAuth('doLogin')"><i class="fa-solid fa-bolt"></i> SIGN IN</button>

<div class="divider">Or Continue With</div>

<div class="social-col">
<button class="pv google" onclick="runAuth('social','Google')"><i class="fa-brands fa-google"></i> GOOGLE</button>
<button class="pv github" onclick="runAuth('social','GitHub')"><i class="fa-brands fa-github"></i> GITHUB</button>
<button class="pv discord" onclick="runAuth('social','Discord')"><i class="fa-brands fa-discord"></i> DISCORD</button>
</div>

<p class="auth-switch">Don't have an account? <a href="register.html">Create account</a></p>
<p class="auth-note"><span class="dot">●</span> SECURE AUTHENTICATION</p>

</div>
</div>

<script src="auth-firebase.js"></script>
<script>
function showLoad(){var e=document.getElementById('authLoad');if(e)e.style.display='block';}
function hideLoad(){var e=document.getElementById('authLoad');if(e)e.style.display='none';}
if(typeof err==='function'){var _e=err,_o=ok;err=function(m){hideLoad();_e(m);};ok=function(m){hideLoad();_o(m);};}
function runAuth(fn,arg){if(typeof window[fn]!=='function'){alert('auth-firebase.js not connected yet.');return;}showLoad();window[fn](arg);}
</script>
</body>
  </html>
